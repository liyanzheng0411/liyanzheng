<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f0">
  <title>SourceCheck | Statistics practice</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip" href="#stage">Skip to activity</a>
  <header class="top">
    <div class="bar">
      <div class="identity"><span class="mark" aria-hidden="true">✓</span><span>SourceCheck</span></div>
      <span class="badge"><span aria-hidden="true"></span> Study prototype</span>
    </div>
  </header>
  <main class="shell">
    <div class="hero">
      <p class="eyebrow">STATISTICS PRACTICE</p>
      <h1>Check an AI answer</h1>
      <p>Work through one short question and decide whether the answer is supported.</p>
    </div>
    <nav aria-label="Activity progress">
      <ol id="progress" class="progress"></ol>
    </nav>
    <div id="stage" class="workspace" tabindex="-1"></div>
    <p id="announcement" class="visually-hidden" role="status"></p>
    <footer class="footer">SourceCheck · Simulated AI responses · Introductory statistics</footer>
  </main>
</body>
</html>
